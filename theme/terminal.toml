# terminal: the terminal's sixteen colours only. Helix format.

"ui.text" = { }
"ui.text.inactive" = { modifiers = ["dim"] }
"ui.text.focus" = { fg = "blue", modifiers = ["bold"] }
"ui.selection" = { modifiers = ["reversed"] }
"ui.cursor" = { modifiers = ["reversed"] }
"ui.statusline" = { modifiers = ["dim"] }
"ui.statusline.key" = { modifiers = ["bold"] }
"ui.window" = { modifiers = ["dim"] }
"ui.window.focus" = "blue"
"ui.popup" = "blue"
"ui.menu" = { modifiers = ["dim"] }
"ui.menu.selected" = { fg = "blue", modifiers = ["reversed"] }

"error" = "red"
"warning" = "yellow"
"info" = "cyan"
"hint" = { modifiers = ["dim"] }

"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link" = { fg = "cyan", modifiers = ["underlined"] }
"markup.link.broken" = { fg = "red", modifiers = ["crossed_out"] }
"markup.tag" = "magenta"
"markup.quote" = { modifiers = ["italic"] }
"markup.raw" = { modifiers = ["dim"] }
"markup.list" = { modifiers = ["dim"] }
"markup.list.checked" = "green"
"markup.callout" = { fg = "yellow", modifiers = ["bold"] }
"markup.table.header" = { modifiers = ["bold"] }
"markup.separator" = { modifiers = ["dim"] }

"canvas.header" = { modifiers = ["bold"] }
"canvas.separator" = { modifiers = ["dim"] }
"canvas.card.focused" = "blue"

"widget.checkbox" = { modifiers = ["bold"] }
"widget.date" = { modifiers = ["dim"] }
"widget.tag" = "magenta"
